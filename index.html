<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mitwa Properties CRM V3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#172033}.app{max-width:1180px;margin:auto;min-height:100vh}header{background:#164e7a;color:#fff;padding:22px 18px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}header h1{margin:0 0 4px;font-size:25px}header p{margin:0;opacity:.9;font-size:13px}.header-actions{display:flex;gap:8px;align-items:center}.userpill{font-size:11px;background:#ffffff22;padding:8px 10px;border-radius:20px}.login{max-width:440px;margin:12vh auto;padding:22px}.login .box,.setup .box{background:#fff;border:1px solid #e5ebf1;border-radius:18px;padding:22px;box-shadow:0 8px 30px #11395c12}.login h1{color:#164e7a;margin-top:0}.login p,.setup p{color:#687386;font-size:13px;line-height:1.5}.field{margin:10px 0}.field label{display:block;font-size:11px;color:#596579;font-weight:700;margin:3px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #d6dee8;border-radius:10px;background:#fff;font-size:14px}textarea{min-height:75px}button{cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.primary{background:#164e7a;color:#fff}.secondary{background:#edf2f6;color:#172033}.danger{background:#fff0ef;color:#b42318}.wide{width:100%}.error{background:#fff0ef;color:#a52820;border-radius:10px;padding:10px;font-size:12px;margin:10px 0}.ok{background:#e8f7ef;color:#16834b;border-radius:10px;padding:10px;font-size:12px;margin:10px 0}.setup{max-width:650px;margin:8vh auto;padding:18px}.setup code{background:#f0f3f6;padding:2px 5px;border-radius:5px}.hint{background:#f7fafc;border:1px solid #e1e7ee;border-radius:12px;padding:12px;font-size:12px;color:#596579}.nav{display:flex;overflow:auto;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #e1e7ee}.nav button{min-width:105px;flex:1;padding:13px 6px;border:0;background:#fff;color:#607084;font-weight:800;font-size:12px;border-bottom:3px solid transparent}.nav button.active{color:#164e7a;border-bottom-color:#164e7a}main{padding:16px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.item{background:#fff;border:1px solid #e5ebf1;border-radius:15px;padding:15px;box-shadow:0 4px 15px #11395c0c}.card small,.muted{color:#687386;font-size:12px}.amount{font-size:23px;font-weight:900;margin-top:6px}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:21px 0 10px}.section h2{font-size:18px;margin:0}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:900;background:#e9f2ff;color:#1459a0}.good{background:#e8f7ef;color:#16834b}.warn{background:#fff3df;color:#b56700}.bad{background:#ffe8e6;color:#b42318}.empty{background:#fff;border:1px dashed #ccd6e0;border-radius:15px;padding:27px;text-align:center;color:#687386}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:23px 23px 0 0;padding:20px}.sheet h2{margin:0 0 14px}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions button{flex:1}.overdue{border-left:4px solid #b42318}footer{text-align:center;color:#8994a3;font-size:11px;padding:25px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}header{align-items:flex-start;flex-direction:column}.header-actions{width:100%}.header-actions button{margin-left:auto}}
</style></head><body>
<div id="root"></div>
<script>
/* ==========================================================
   MITWA PROPERTIES CRM V3
   1) Put your Supabase Project URL and Publishable/anon key here.
   2) Do NOT put a service_role key or database password here.
   ========================================================== */
const SUPABASE_URL = 'https://ocdiutbwxqvihbexdgar.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DJEo9Iy-XdpBQoXOOjCcXA_rDRwN8gz';

const hasConfig = SUPABASE_URL.startsWith('https://') && !SUPABASE_KEY.startsWith('PASTE_');
const sb = hasConfig ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money = n => n!==null && n!==undefined && n!=='' ? '₹'+Number(n).toLocaleString('en-IN') : '—';
const today = () => new Date().toISOString().slice(0,10);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)});
let state={user:null,profile:null,properties:[],owners:[],clients:[],leads:[],visits:[],followups:[],deals:[],agents:[]};
let editing=null;

function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render();}
function modal(title,body){$('mtitle').textContent=title;$('form').innerHTML=body;$('modal').style.display='flex'}
function close(){ $('modal').style.display='none'; editing=null }
window.onclick=e=>{if(e.target.id==='modal')close()};
function oneline(s){return esc(s||'—')}
function cname(id){return state.clients.find(x=>x.id===id)?.name||'Unknown client'}
function pname(id){const p=state.properties.find(x=>x.id===id);return p?(p.building_name||p.property_type||'Property')+(p.unit_number?' — '+p.unit_number:''): 'Unknown property'}
function oname(id){return state.owners.find(x=>x.id===id)?.name||'Unknown owner'}
function opts(arr,sel,label,nameFn){return '<option value="">— '+label+' —</option>'+arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(nameFn?nameFn(x):(x.name||pname(x.id)))}</option>`).join('')}
function msg(type,text){const el=$(type==='error'?'message':'message');if(el){el.className=type;el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',5000)}}

function loginScreen(){
 $('root').innerHTML=`<div class="login"><div class="box"><h1>Mitwa Properties CRM</h1><p>V3 Cloud CRM • Secure login • Properties • Owners • Clients • Leads • Visits • Follow-ups • Deals</p><div id="message" style="display:none"></div><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="primary wide" onclick="login()">Sign In</button><div class="hint" style="margin-top:12px">Use the Admin account you created in Supabase Authentication. Your password is never stored in this page.</div></div></div>`;
}
function setupScreen(){
 $('root').innerHTML=`<div class="setup"><div class="box"><h1>Connect Mitwa Properties CRM to Supabase</h1><p>Step 4 needs your Supabase Project URL and Publishable/anon key. Paste them only into the two constants near the top of this HTML file.</p><div class="hint"><b>Project URL:</b> looks like <code>https://xxxxxxxx.supabase.co</code><br><br><b>Publishable key:</b> use the publishable/anon key from Supabase API settings.<br><br><b>Never use:</b> service_role key or database password.</div><p>After saving the file, reopen it. The login screen will appear.</p></div></div>`;
}
async function login(){
 const email=$('loginEmail').value.trim(),password=$('loginPassword').value;
 if(!email||!password)return msg('error','Enter your email and password.');
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error)return msg('error',error.message);
 await boot();
}
async function logout(){await sb.auth.signOut();state={user:null,profile:null,properties:[],owners:[],clients:[],leads:[],visits:[],followups:[],deals:[],agents:[]};loginScreen()}

async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){loginScreen();return}
 state.user=user;
 const {data:profile,error}=await sb.from('users').select('*').eq('id',user.id).maybeSingle();
 if(error){console.error(error);return showApp('Could not read CRM user profile: '+error.message)}
 state.profile=profile;
 await loadAll();
 showApp();
}
async function loadAll(){
 const tables=['owners','properties','clients','leads','site_visits','followups','deals','agents'];
 const results=await Promise.all(tables.map(t=>sb.from(t).select('*')));
 const names=['owners','properties','clients','leads','visits','followups','deals','agents'];
 results.forEach((r,i)=>{if(r.error)throw r.error;state[names[i]]=r.data||[]});
}
function showApp(errorText=''){
 $('root').innerHTML=`<div class="app"><header><div><h1>Mitwa Properties CRM</h1><p>Cloud V3 • Properties • Owners • Clients • Leads • Visits • Follow-ups • Deals</p></div><div class="header-actions"><span class="userpill">${esc(state.profile?.name||state.user?.email||'User')} • ${esc(state.profile?.role||'agent')}</span><button class="secondary" onclick="logout()">Sign Out</button></div></header><div class="nav"><button class="active" onclick="page('dashboard',this)">Dashboard</button><button onclick="page('properties',this)">Properties</button><button onclick="page('owners',this)">Owners</button><button onclick="page('clients',this)">Clients</button><button onclick="page('leads',this)">Leads</button><button onclick="page('visits',this)">Site Visits</button><button onclick="page('followups',this)">Follow-ups</button><button onclick="page('deals',this)">Deals</button><button onclick="page('agents',this)">Agents</button></div><main>
<section id="dashboard" class="page active"><div class="cards"><div class="card"><small>Properties</small><div class="amount" id="sP">0</div></div><div class="card"><small>Available</small><div class="amount" id="sA">0</div></div><div class="card"><small>Owners</small><div class="amount" id="sO">0</div></div><div class="card"><small>Clients</small><div class="amount" id="sC">0</div></div><div class="card"><small>Open Leads</small><div class="amount" id="sL">0</div></div><div class="card"><small>Site Visits</small><div class="amount" id="sV">0</div></div><div class="card"><small>Follow-ups Due</small><div class="amount" id="sF">0</div></div><div class="card"><small>Deals</small><div class="amount" id="sD">0</div></div><div class="card"><small>Agents</small><div class="amount" id="sAg">0</div></div></div><div class="section"><h2>Upcoming Follow-ups</h2><button class="primary" onclick="openFollowup()">+ Add Follow-up</button></div><div id="dashFollow"></div><div class="section"><h2>Recent Activity</h2></div><div id="activity"></div></section>
<section id="properties" class="page"><div class="section"><h2>Properties</h2><button class="primary" onclick="openProperty()">+ Add Property</button></div><div class="toolbar"><input id="ps" placeholder="Search property, location, owner..." oninput="render()"></div><div id="plist"></div></section>
<section id="owners" class="page"><div class="section"><h2>Property Owners</h2><button class="primary" onclick="openOwner()">+ Add Owner</button></div><div class="toolbar"><input id="os" placeholder="Search owner or mobile..." oninput="render()"></div><div id="olist"></div></section>
<section id="clients" class="page"><div class="section"><h2>Buyers / Clients</h2><button class="primary" onclick="openClient()">+ Add Client</button></div><div class="toolbar"><input id="cs" placeholder="Search client, location, requirement..." oninput="render()"></div><div id="clist"></div></section>
<section id="leads" class="page"><div class="section"><h2>Leads</h2><button class="primary" onclick="openLead()">+ Add Lead</button></div><div class="toolbar"><input id="ls" placeholder="Search lead, client, property..." oninput="render()"></div><div id="llist"></div></section>
<section id="visits" class="page"><div class="section"><h2>Site Visits</h2><button class="primary" onclick="openVisit()">+ Add Site Visit</button></div><div class="toolbar"><input id="vs" placeholder="Search client, property, date..." oninput="render()"></div><div id="vlist"></div></section>
<section id="followups" class="page"><div class="section"><h2>Follow-ups</h2><button class="primary" onclick="openFollowup()">+ Add Follow-up</button></div><div class="toolbar"><input id="fs" placeholder="Search client, date, notes..." oninput="render()"></div><div id="flist"></div></section>
<section id="deals" class="page"><div class="section"><h2>Deals</h2><button class="primary" onclick="openDeal()">+ Add Deal</button></div><div class="toolbar"><input id="ds" placeholder="Search buyer, property, status..." oninput="render()"></div><div id="dlist"></div></section>
<section id="agents" class="page"><div class="section"><h2>Agent Directory</h2><button class="primary" onclick="openAgent()">+ Add Agent</button></div><div class="toolbar"><input id="ags" placeholder="Search agent name, mobile, company..." oninput="render()"></div><div id="aglist"></div></section>
</main><footer>Mitwa Properties CRM V3 • Supabase Cloud Database</footer></div><div class="modal" id="modal"><div class="sheet"><h2 id="mtitle"></h2><div id="form"></div></div></div>`;
 render();
 if(errorText)alert(errorText);
}

function render(){
 if(!$('sP'))return;
 $('sP').textContent=state.properties.length;$('sA').textContent=state.properties.filter(x=>x.status==='Available').length;$('sO').textContent=state.owners.length;$('sC').textContent=state.clients.length;$('sL').textContent=state.leads.filter(x=>!['Closed','Lost'].includes(x.status)).length;$('sV').textContent=state.visits.filter(x=>x.status!=='Cancelled').length;$('sF').textContent=state.followups.filter(x=>x.status==='Pending').length;$('sD').textContent=state.deals.filter(x=>x.status!=='Cancelled').length;$('sAg').textContent=state.agents.length;
 let q=($('ps')?.value||'').toLowerCase();let a=state.properties.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('plist').innerHTML=a.map(p=>`<div class=item><div class=row><div><h3>${oneline(p.building_name||p.property_type)} ${p.unit_number?'— '+esc(p.unit_number):''}</h3><div class=muted>${oneline(p.location||p.address)} · ${oneline(p.property_type)} · ${oneline(p.listing_type)}</div></div><span class="badge ${p.status==='Available'?'good':p.status==='Sold'?'bad':'warn'}">${esc(p.status)}</span></div><div class=row><b>${money(p.asking_price)}</b><span class=muted>${p.area_sqft?esc(p.area_sqft)+' sq.ft. · ':''}${oneline(p.bhk)} · Owner: ${oname(p.owner_id)}</span></div><div class=actions style="margin-top:10px"><button class=secondary onclick="openProperty('${p.id}')">Edit</button><button class=danger onclick="delRecord('properties','${p.id}')">Delete</button></div></div>`).join('')||'<div class=empty>No properties found.</div>';
 q=($('os')?.value||'').toLowerCase();a=state.owners.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('olist').innerHTML=a.map(o=>`<div class=item><h3>${oneline(o.name)}</h3><div class=muted>${oneline(o.mobile)} · ${oneline(o.email)} · ${state.properties.filter(p=>p.owner_id===o.id).length} linked properties</div><div class=row><span class=muted>${oneline(o.address)}</span><div class=actions><button class=secondary onclick="openOwner('${o.id}')">Edit</button><button class=danger onclick="delOwner('${o.id}')">Delete</button></div></div></div>`).join('')||'<div class=empty>No owners found.</div>';
 q=($('cs')?.value||'').toLowerCase();a=state.clients.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('clist').innerHTML=a.map(c=>`<div class=item><div class=row><div><h3>${oneline(c.name)}</h3><div class=muted>${oneline(c.mobile)} · ${oneline(c.email)}</div></div><span class=badge>${esc(c.status)}</span></div><div class=row><span>${oneline(c.preferred_location)} · ${oneline(c.property_type)} · ${oneline(c.bhk)}</span><b>${c.max_budget?money(c.min_budget)+' – '+money(c.max_budget):'Budget not set'}</b></div><div class=muted>Purpose: ${oneline(c.purpose)} · Loan: ${c.loan_required?'Yes':'No'}</div><div class=actions style="margin-top:10px"><button class=secondary onclick="openClient('${c.id}')">Edit</button><button class=danger onclick="delRecord('clients','${c.id}')">Delete</button></div></div>`).join('')||'<div class=empty>No clients found.</div>';
 let f=state.followups.filter(x=>x.status==='Pending').sort((a,b)=>String(a.followup_date).localeCompare(String(b.followup_date))).slice(0,6);$('dashFollow').innerHTML=f.map(x=>`<div class="item ${x.followup_date<today()?'overdue':''}"><div class=row><div><b>${oneline(cname(x.client_id))}</b><div class=muted>${esc(x.followup_date)} · ${esc(x.mode)}</div></div><button class=secondary onclick="doneF('${x.id}')">Mark Done</button></div></div>`).join('')||'<div class=empty>No pending follow-ups.</div>';
 let act=[...state.visits.slice(-3).map(x=>'Site visit: '+cname(x.client_id)+' — '+visitPropertyLabel(x)+' — '+x.visit_date),...state.deals.slice(-3).map(x=>'Deal: '+cname(x.client_id)+' — '+pname(x.property_id)+' — '+x.status),...state.leads.slice(-3).map(x=>'Lead: '+cname(x.client_id)+' — '+x.status)];$('activity').innerHTML=act.slice(-7).reverse().map(x=>`<div class=item muted>${esc(x)}</div>`).join('')||'<div class=empty>No activity yet.</div>';
 renderLists();
}
function renderLists(){
 let q=($('ls')?.value||'').toLowerCase(),a=state.leads.filter(x=>(cname(x.client_id)+' '+pname(x.property_id)+' '+JSON.stringify(x)).toLowerCase().includes(q));$('llist').innerHTML=a.map(x=>`<div class=item><div class=row><div><h3>${oneline(cname(x.client_id))}</h3><div class=muted>${oneline(pname(x.property_id))} · Source: ${oneline(x.source)}</div></div><span class=badge>${esc(x.status)}</span></div><div class=row><span class=muted>Next: ${oneline(x.next_followup)}</span><div class=actions><button class=secondary onclick="openLead('${x.id}')">Edit</button><button class=danger onclick="delRecord('leads','${x.id}')">Delete</button></div></div></div>`).join('')||'<div class=empty>No leads yet.</div>';
 q=($('vs')?.value||'').toLowerCase();a=state.visits.filter(x=>(cname(x.client_id)+' '+pname(x.property_id)+' '+(x.external_property_name||'')+' '+(x.builder_project_name||'')+' '+(x.external_agent_name||'')+' '+(x.external_agent_phone||'')+' '+JSON.stringify(x)).toLowerCase().includes(q));$('vlist').innerHTML=a.map(x=>{const other=x.property_source==='Other Agent';const prop=other?(x.external_property_name||'Other Agent Property'):(pname(x.property_id));return `<div class=item><div class=row><div><h3>${oneline(cname(x.client_id))}</h3><div class=muted>${oneline(prop)}${x.builder_project_name?` · Builder/Project: ${oneline(x.builder_project_name)}`:''}</div>${other&&(x.external_agent_name||x.external_agent_id)?`<div class=muted>Other Agent: ${oneline(agentName(x.external_agent_id)||x.external_agent_name)}${x.external_agent_phone?' · '+oneline(x.external_agent_phone):''}</div>`:''}</div><span class=badge>${esc(x.status)}</span></div><div class=row><b>${esc(x.visit_date)} ${esc(x.visit_time||'')}</b><div class=actions><button class=secondary onclick="openVisit('${x.id}')">Edit</button><button class=danger onclick="delRecord('site_visits','${x.id}')">Delete</button></div></div>${x.feedback?`<div class=muted>Feedback: ${esc(x.feedback)}</div>`:''}</div>`}).join('')||'<div class=empty>No site visits yet.</div>';
 q=($('fs')?.value||'').toLowerCase();a=state.followups.filter(x=>(cname(x.client_id)+' '+JSON.stringify(x)).toLowerCase().includes(q)).sort((a,b)=>String(a.followup_date).localeCompare(String(b.followup_date)));$('flist').innerHTML=a.map(x=>`<div class="item ${x.status==='Pending'&&x.followup_date<today()?'overdue':''}"><div class=row><div><h3>${oneline(cname(x.client_id))}</h3><div class=muted>${esc(x.followup_date)} · ${esc(x.mode)}</div></div><span class=badge>${x.status==='Completed'?'Done':x.followup_date<today()&&x.status==='Pending'?'Overdue':esc(x.status)}</span></div><div class=actions><button class=secondary onclick="doneF('${x.id}')">Mark Done</button><button class=secondary onclick="openFollowup('${x.id}')">Edit</button><button class=danger onclick="delRecord('followups','${x.id}')">Delete</button></div>${x.notes?`<div class=muted>${esc(x.notes)}</div>`:''}</div>`).join('')||'<div class=empty>No follow-ups yet.</div>';
 q=($('ds')?.value||'').toLowerCase();a=state.deals.filter(x=>(cname(x.client_id)+' '+pname(x.property_id)+' '+JSON.stringify(x)).toLowerCase().includes(q));$('dlist').innerHTML=a.map(x=>`<div class=item><div class=row><div><h3>${oneline(cname(x.client_id))}</h3><div class=muted>${oneline(pname(x.property_id))}</div></div><span class=badge>${esc(x.status)}</span></div><div class=row><b>${money(x.final_price)}</b><span class=muted>Token ${money(x.token_amount)} · Brokerage ${money(x.brokerage_amount)} · ${esc(x.deal_date||'')}</span></div><div class=actions><button class=secondary onclick="openDeal('${x.id}')">Edit</button><button class=danger onclick="delRecord('deals','${x.id}')">Delete</button></div></div>`).join('')||'<div class=empty>No deals yet.</div>';
 q=($('ags')?.value||'').toLowerCase();a=state.agents.filter(x=>(x.name+' '+(x.mobile||'')+' '+(x.company||'')+' '+(x.location||'')).toLowerCase().includes(q));$('aglist').innerHTML=a.map(x=>`<div class=item><div class=row><div><h3>${oneline(x.name)}</h3><div class=muted>${oneline(x.mobile)}${x.company?' · '+oneline(x.company):''}${x.location?' · '+oneline(x.location):''}</div></div><span class=badge>${x.active?'Active':'Inactive'}</span></div><div class=muted>WhatsApp: ${oneline(x.whatsapp||x.mobile)} · ${state.visits.filter(v=>v.external_agent_id===x.id).length} site visits</div><div class=actions style="margin-top:10px"><button class=secondary onclick="openAgent('${x.id}')">Edit</button><button class=danger onclick="delAgent('${x.id}')">Delete</button></div></div>`).join('')||'<div class=empty>No agents found.</div>';
}

function fields(type,x={}){

ernal_agent_phone)}"></div></div><div><label>Date *</label><input id=f3 type=date value="${esc(x.visit_date||today())}"></div><div><label>Time</label><input id=f4 type=time value="${esc(x.visit_time)}"></div><div><label>Status</label><select id=f5>${['Scheduled','Completed','Cancelled','Rescheduled'].map(v=>`<option ${v===(x.status||'Scheduled')?'selected':''}>${v}</option>`).join('')}</select></div><div class=full><label>Feedback</label><textarea id=f6>${esc(x.feedback)}</textarea></div><div class=full><label>Next Action</label><input id=f7 value="${esc(x.next_action)}"></div></div>`}

/* Optional V2 migration: imports the old localStorage data into the cloud database.
   It is deliberately manual so nothing is copied without the user's action. */
async function migrateV2(){
 const raw=JSON.parse(localStorage.getItem('realEstateCRM_v2')||localStorage.getItem('realEstateCRM_v1')||'null');
 if(!raw)return alert('No V2 local data was found in this browser.');
 if(!confirm('Import the V2 properties, owners and clients from this browser into Supabase?'))return;
 try{
  const ownerMap=new Map(),clientMap=new Map(),propertyMap=new Map();
  for(const x of (raw.owners||[])){const id=uuid();ownerMap.set(x.id,id);await sb.from('owners').upsert({id,owner_id:x.displayId||('OWN-'+id.slice(0,7)),name:x.name,mobile:x.mobile,whatsapp:x.whatsapp,email:x.email,address:x.address,expected_price:x.expected,minimum_price:x.minimum,notes:x.notes}).throwOnError()}
  for(const x of (raw.clients||[])){const id=uuid();clientMap.set(x.id,id);await sb.from('clients').upsert({id,client_id:x.displayId||('CLI-'+id.slice(0,7)),name:x.name,mobile:x.mobile,whatsapp:x.whatsapp,email:x.email,status:x.status||'New',preferred_location:x.location,property_type:x.type,bhk:x.bhk,min_budget:x.minBudget?Number(x.minBudget):null,max_budget:x.maxBudget?Number(x.maxBudget):null,purpose:x.purpose,loan_required:x.loan==='Yes',required_area_sqft:x.area?Number(x.area):null,notes:x.notes}).throwOnError()}
  for(const x of (raw.properties||[])){const id=uuid();propertyMap.set(x.id,id);await sb.from('properties').upsert({id,property_id:x.displayId||('PROP-'+id.slice(0,7)),owner_id:ownerMap.get(x.ownerId)||null,property_type:x.type||'Flat',listing_type:x.listing||'Sale',building_name:x.building,unit_number:x.unit,address:x.address,location:x.location,bhk:x.bhk,area_sqft:x.area?Number(x.area):null,floor:x.floor,asking_price:x.price?Number(x.price):null,status:x.status||'Available',description:x.remarks}).throwOnError()}
  for(const x of (raw.leads||[])){await sb.from('leads').upsert({id:uuid(),lead_id:x.displayId||('LEAD-'+Date.now()),client_id:clientMap.get(x.clientId),property_id:propertyMap.get(x.propertyId)||null,source:x.source,status:x.status||'New',next_followup:x.next||null,notes:x.notes,assigned_to:state.user.id}).throwOnError()}
  alert('V2 import completed. Reloading cloud data.');await loadAll();render();
 }catch(e){alert('Import stopped: '+e.message)}
}
